<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The org API's fav_icon still wins: organization-context.tsx rewrites this
         link once the branding call returns. This is the default that stands in
         until then, so the tab shows the mark immediately instead of asking for
         /favicon.ico, getting a 404 and sitting on the browser's blank page icon
         for a whole API round-trip.

         It was previously left out to avoid flashing the wrong icon before the
         API answered. That risk is gone: public/fav.ico is byte-identical to the
         icon the API serves for this org, so nothing changes when the swap
         happens. Keep the two in step if either is ever replaced.

         The old commented-out version declared type="image/svg+xml" for a file
         that is an ICO — the type is corrected here. -->
    <link rel="icon" type="image/x-icon" href="/fav.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&display=block"
      rel="stylesheet"
    />
    <!-- MCM Unified Console type: Plus Jakarta Sans for UI, IBM Plex Mono for figures -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Title set from org API (fav_title); leave empty to avoid flash before API loads -->
    <!-- <title>Acepeak</title> -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
